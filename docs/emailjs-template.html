<!doctype html>
<html lang="en">
  <body style="margin:0;background:#faf6f0;font-family:Arial,sans-serif;color:#32302e">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#faf6f0;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #e8e2d9;border-radius:6px">
            <tr>
              <td style="padding:32px">
                <p style="margin:0 0 8px;color:#a1845f;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase">New website inquiry</p>
                <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-size:32px;font-weight:400;color:#1a1a1a">Prime Yantra Photography</h1>
                <p style="margin:0 0 28px">Service: {{inquiry_type}}</p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr><td style="padding:10px 0;border-bottom:1px solid #e8e2d9;color:#756e68;width:130px">Name</td><td style="padding:10px 0;border-bottom:1px solid #e8e2d9"><strong>{{from_name}}</strong></td></tr>
                  <tr><td style="padding:10px 0;border-bottom:1px solid #e8e2d9;color:#756e68">Email</td><td style="padding:10px 0;border-bottom:1px solid #e8e2d9"><a href="mailto:{{from_email}}" style="color:#8b6a3e">{{from_email}}</a></td></tr>
                  <tr><td style="padding:10px 0;color:#756e68">Submitted</td><td style="padding:10px 0">{{submitted_at}}</td></tr>
                </table>
                <h2 style="margin:28px 0 10px;font-family:Georgia,serif;font-size:22px;font-weight:400;color:#1a1a1a">Event details &amp; location</h2>
                <div style="white-space:pre-wrap;line-height:1.7;color:#5a5450">{{message}}</div>
                <p style="margin:28px 0 0;padding-top:20px;border-top:1px solid #e8e2d9;font-size:12px;color:#9e958f">Sent from the Prime Yantra Photography website inquiry form.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
